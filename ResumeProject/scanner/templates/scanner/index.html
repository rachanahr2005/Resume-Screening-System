<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
        }

        .card {
            border-radius: 15px;
        }

        .btn-custom {
            background-color: #4facfe;
            color: white;
            font-weight: bold;
        }

        .btn-custom:hover {
            background-color: #007bff;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
    
    <div class="card shadow p-4" style="width: 500px;">
        <h3 class="text-center mb-4">📄 Resume Screening System</h3>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label class="form-label">Job Description</label>
            <textarea class="form-control mb-3" name="job_description" rows="4" placeholder="Enter job description..."></textarea>

            <label class="form-label">Upload Resumes</label>
            <input class="form-control mb-3" type="file" name="resumes" multiple>

            <button class="btn btn-custom w-100">🚀 Screen Resumes</button>
        </form>
    </div>

</div>

</body>
</html>
